bm_1178_chickenheart: "The Chickenheart"
bm_1178_chickenheart_desc: "Many historical events are incontrovertible fact. The fall of the Roman Empire. The First Crusade. The Erfurt latrine disaster. \n\nBut an oft-forgotten period of Medieval history relates to the vile contemporaries of the Angevin King Henry II, who accidentally unleashed upon the world one of the most conniving yet simultaneously pathetic dynasties known to mankind. \n\nFollowing the Great Revolt, The Angevin Empire in chaos, Henry was forced to make a number of hasty, ill-advised appointments. Historians agree that Edmund “Chickenheart” Blackadder’s elevation to the Earldom of West Riding was by FAR the worst among them, having gone to bed a bachelor wastrel one day, and waking a liege lord the next. \n\nOn the continent, the great Lord Flashheart was in Ypres about to begin the travels destined to make him famous, while elsewhere Ludwig “the Indestructible” lurked in the heart of the Holy Roman Empire, cultivating the nascent plot that may one day steal him a Kingdom. \n\nDid Edmund overcome his worst qualities to become a ruler more worthy than a bag of worms? Was Ludwig able trick and cajole his way to a throne? How many engaged women did Flash elope with? \n\n#bold All is revealed in this, a history never before told. Blackadder - Or, The History of the House of Blackadder in the Times of Richard the Lionheart.#!"

bookmark_chickenheart_blackadder: "Prince Edmund IV Blackadder"
bookmark_chickenheart_blackadder_desc: "The young Edmund Blackadder, nephew of Henry II, recently landed for his glorious defection during the Great Revolt, is now saddled with the responsibilities that accompany his high station — and he is thoroughly unequipped to handle them. \n\nWith his bachelor days at an end, Edmund is faced with a choice: can he cunningly scheme, and navigate at court, to rise and meet the expectations made of him? \n\n #bold Or will he shirk his duties and seek his fortune upon the road, with his trusty, if ineffective dogsbody Baldrick, and the sniveling Percy at his side?#!"
bookmark_chickenheart_henry: "King Henry II"
bookmark_chickenheart_baldrick: "Baldrick"
 
bookmark_chickenheart_ludwig: "'The Indestructible'"
bookmark_chickenheart_ludwig_desc: "Gone are the days of being bullied at the schoolhouse. No more dirty hair. No more mockery for your once-small stature. No more of mother's tight shorts. No more pain for #bold shorty-greasy-spot-spot--#! I mean, Prince Ludwig the Indestructible. No. The Master of Disguise will become Master of the World! \n\nWith a claim to the English Throne, will Ludwig 'The Indestructible' be able to garner support amongst his peers in the HRE, and with an iron fist, seize what should be his!"
 
bookmark_chickenheart_flashheart: "Lord Flashheart"
bookmark_chickenheart_flashheart_desc: "Though still young, the Lord Flashheart has made a name for himself as the best sword, the best shot, the best sailor and the best kisser in the Kingdom. #bold The best man.#! \n\nFrom a noble house but with no ancestral lands to call his own, how far can his insatiable lust for adventure (and women) take him?"
bookmark_chickenheart_bob: "Bob"

bookmark_chickenheart_macadder: "Mormear Euan MacAdder"
bookmark_chickenheart_macadder_desc: "Eaun MacAdder, #bold the most dangerous man ever to wear a skirt in Europe.#! \n\nHe believes himself the rightful king of England for the simpple reason of "Them eejits is muckin it all up", or something like that. \n\nWhile he may not possess the legitimacy of other pretenders, he certainly has the means to back up his claims: unrivaled skill with a broadsword, and a rabble-rousing ability one loud speech away from whipping his fellow highlanders into an invasion-frenzy."

bm_1066_duc_blackadder: "Blackadder The Third"
bm_1066_duc_blackadder_desc: "The fate of England is in crisis, but while William the Conqueror, Harold Godwinson, and Harald Hardrada are names that will be remembered throughout history, one name is oft forgotten: \n\n#bold Edmund III Blackadder!#! \n\nAmidst these warring giants, can he defend his ancestral home? Will you follow in his footsteps and bow to the Norman conquerors? Or will you join in against the harrying, and throw off the Norman yolk?"
bookmark_duc_blackadder_blackadder: "Edmund III Blackadder"
bookmark_duc_blackadder_blackadder_desc: "Your lineage goes back centuries, having reigned in the hills of Surrey, but now this long lasting lineage of fools and liars is under threat from a force that musters on Norman shores... Despite his best efforts to secure his lineage, plague has struck down every potential heir to the title, will you and your twin-sister secure your lineage? Or will it croak under the Norman Yolk?"
bookmark_duc_blackadder_baldrick: "Baldrick"
bookmark_duc_blackadder_georgina: "Georgina"

