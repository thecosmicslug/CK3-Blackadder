tba_bookmark.blackadder.queenofspain: "The Queen of Spain's Beard"
tba_bookmark.blackadder.queenofspain.desc: "No more shall you be known as Blackadder the Bachelor of Basingstoke, your hand now promised to the Infanta, oh the Infanta, when first you heard her name, it was a dream! But now you have met her and she is a NIGHTMARE! Ranchorous, leecherous, and lewd! And with the face of a toad!"
tba_bookmark.blackadder.queenofspain.a: "I have a cunning plan..."
tba_bookmark.blackadder.queenofspain.a_flavor: "My trusty dogsbody Baldrick has come to me with a most cunning plan. My old sweetheart, Bob- I meant Kate, who squired for my father is still yet unmarried, I can surely elope with her in time, and get an annulment!"
tba_bookmark.blackadder.queenofspain.b: "Baldrick! Percy! Grab what you can quickly, we must run away!!"
tba_bookmark.blackadder.queenofspain.b_flavor: "I have only just become a lord, and I can just as well abandon it all again, if I get to be rid of that incestious spanish infanta! we must grab what we can, and flee England at once on the first ferry from Dover!"
tba_bookmark.blackadder.queenofspain.c: "You can't run forever, its time to accept your fate..."

